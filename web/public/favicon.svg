<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Orrery: concentric orbits with planets -->
  <!-- Background -->
  <circle cx="24" cy="24" r="23" fill="#1e1e2e"/>
  <!-- Orbits -->
  <circle cx="24" cy="24" r="8" fill="none" stroke="#4a4a6a" stroke-width="1"/>
  <circle cx="24" cy="24" r="14" fill="none" stroke="#4a4a6a" stroke-width="1"/>
  <circle cx="24" cy="24" r="20" fill="none" stroke="#4a4a6a" stroke-width="1"/>
  <!-- Sun -->
  <circle cx="24" cy="24" r="3" fill="#f5c542"/>
  <!-- Inner planet -->
  <circle cx="32" cy="24" r="2" fill="#7e9cd8"/>
  <!-- Middle planet -->
  <circle cx="24" cy="10" r="2.5" fill="#e46876"/>
  <!-- Outer planet -->
  <circle cx="7" cy="30" r="2" fill="#98bb6c"/>
</svg>
