<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Plait: concentric orbits with planets -->
  <!-- Light background -->
  <circle cx="24" cy="24" r="23" fill="white" stroke="#9090a0" stroke-width="1"/>
  <!-- Orbits -->
  <circle cx="24" cy="24" r="8" fill="none" stroke="#606080" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="14" fill="none" stroke="#606080" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="20" fill="none" stroke="#606080" stroke-width="1.5"/>
  <!-- Sun -->
  <circle cx="24" cy="24" r="4" fill="#f5c542"/>
  <!-- Inner planet -->
  <circle cx="32" cy="24" r="3" fill="#5b7fc7"/>
  <!-- Middle planet -->
  <circle cx="24" cy="10" r="3.5" fill="#d94860"/>
  <!-- Outer planet -->
  <circle cx="7" cy="30" r="3" fill="#76a44e"/>
</svg>
